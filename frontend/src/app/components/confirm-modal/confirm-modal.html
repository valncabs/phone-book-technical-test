<div class="modal-header">
  <h4 class="modal-title">
    Confirm Delete
  </h4>
</div>

<div class="modal-body">
  <p>{{ message }}</p>
</div>

<div class="modal-footer">

  <button
    type="button"
    class="btn btn-secondary"
    (click)="cancel()">
    No
  </button>

  <button
    type="button"
    class="btn btn-danger"
    (click)="confirm()">
    Yes
  </button>

</div>
